<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c11"/>
      <stop offset="100%" stop-color="#0d1419"/>
    </linearGradient>
    <radialGradient id="glow-gold" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(200,169,110,0.06)"/>
      <stop offset="100%" stop-color="rgba(200,169,110,0)"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="rgba(224,92,92,0.06)"/>
      <stop offset="100%" stop-color="rgba(224,92,92,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow-gold)"/>
  <rect width="800" height="600" fill="url(#glow-red)"/>

  <!-- Top frame -->
  <line x1="0" y1="44" x2="800" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="24" y="28" font-family="'DM Mono', monospace" font-size="9" fill="#c8a96e" letter-spacing="1.8">PETAL · INSIGHTS · EARLY SCREENING</text>
  <text x="400" y="28" font-family="'Cormorant Garamond', serif" font-size="16" font-style="italic" fill="rgba(242,244,247,0.72)" text-anchor="middle">CT Pulmonary Angiography</text>
  <text x="776" y="28" font-family="'DM Mono', monospace" font-size="9" fill="rgba(242,244,247,0.42)" letter-spacing="1.4" text-anchor="end">TAP STAGES BELOW</text>

  <!-- Divider between left and right panels -->
  <line x1="430" y1="44" x2="430" y2="564" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Left: scan viewer -->
  <g transform="translate(33, 90)">
    <!-- Frame -->
    <rect x="0" y="0" width="380" height="380" fill="#05080b" stroke="rgba(224,92,92,0.4)" stroke-width="1" rx="2"/>
    <text x="10" y="18" font-family="'DM Mono', monospace" font-size="8" fill="#e05c5c" letter-spacing="1.2">CTPA · POSITIVE</text>
    <text x="370" y="18" font-family="'DM Mono', monospace" font-size="8" fill="#e05c5c" letter-spacing="1.2" text-anchor="end">STAGE 04 / 04</text>

    <!-- Vessel tree at peak with filling defect -->
    <g>
      <ellipse cx="190" cy="200" rx="145" ry="135" fill="none" stroke="rgba(242,244,247,0.06)" stroke-width="1"/>
      <circle cx="190" cy="305" r="14" fill="rgba(242,244,247,0.08)"/>
      <path d="M 150 205 Q 140 175 165 160 Q 190 150 215 160 Q 240 175 235 205 Q 230 240 190 255 Q 155 240 150 205 Z" fill="rgba(242,244,247,0.04)" stroke="rgba(242,244,247,0.12)" stroke-width="1"/>

      <!-- All vessels in cream contrast -->
      <path d="M 190 195 L 190 170" stroke="#f4e8c8" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M 190 170 Q 210 160 240 165 L 275 170" stroke="#f4e8c8" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M 260 165 Q 285 155 295 140 L 305 118" stroke="#f4e8c8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 275 170 Q 295 175 310 185 L 325 200" stroke="#f4e8c8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 275 170 Q 295 195 305 220 L 315 260" stroke="#f4e8c8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 305 118 L 315 100 M 305 118 L 325 115" stroke="#f4e8c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 325 200 L 345 205 M 325 200 L 335 218" stroke="#f4e8c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 315 260 L 325 275 M 315 260 L 300 285" stroke="#f4e8c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 190 170 Q 170 160 140 165 L 105 170" stroke="#f4e8c8" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M 120 165 Q 95 155 85 140 L 75 118" stroke="#f4e8c8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 105 170 Q 85 175 70 185 L 55 200" stroke="#f4e8c8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 105 170 Q 85 195 75 220 L 65 260" stroke="#f4e8c8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 75 118 L 65 100 M 75 118 L 55 115" stroke="#f4e8c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 55 200 L 35 205 M 55 200 L 45 218" stroke="#f4e8c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 65 260 L 55 275 M 65 260 L 80 285" stroke="#f4e8c8" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Filling defect with pulse rings -->
      <ellipse cx="290" cy="170" rx="14" ry="5" fill="#05080b"/>
      <circle cx="290" cy="170" r="14" fill="none" stroke="#e05c5c" stroke-width="1.2" opacity="0.4"/>
      <circle cx="290" cy="170" r="22" fill="none" stroke="#e05c5c" stroke-width="0.8" opacity="0.2"/>
      <circle cx="290" cy="170" r="3" fill="#e05c5c" opacity="0.9"/>
    </g>

    <text x="10" y="370" font-family="'DM Mono', monospace" font-size="9" fill="rgba(242,244,247,0.72)" letter-spacing="0.9">T + 14.5s</text>
    <text x="370" y="370" font-family="'DM Mono', monospace" font-size="8" fill="rgba(242,244,247,0.42)" letter-spacing="0.8" text-anchor="end">5MM / SLICE</text>
  </g>

  <!-- Stage label below scan -->
  <text x="223" y="500" font-family="'DM Mono', monospace" font-size="9" fill="#c8a96e" letter-spacing="1.8" text-anchor="middle">STAGE 04 · DIAGNOSIS</text>
  <text x="223" y="520" font-family="'Cormorant Garamond', serif" font-size="17" font-weight="600" fill="#f2f4f7" text-anchor="middle">Filling defect identified</text>

  <!-- Right: info panel -->
  <g transform="translate(458, 90)">
    <text x="0" y="22" font-family="'DM Mono', monospace" font-size="9" fill="#c8a96e" letter-spacing="1.8">WHAT YOU ARE SEEING</text>
    <line x1="0" y1="32" x2="316" y2="32" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <text x="0" y="68" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="600" fill="#f2f4f7">The clot, caught.</text>

    <text x="0" y="105" font-family="'Outfit', sans-serif" font-size="12" font-weight="300" fill="rgba(242,244,247,0.72)">A dark patch in the bright vessel: the filling</text>
    <text x="0" y="120" font-family="'Outfit', sans-serif" font-size="12" font-weight="300" fill="rgba(242,244,247,0.72)">defect. Contrast fills the pulmonary artery up</text>
    <text x="0" y="135" font-family="'Outfit', sans-serif" font-size="12" font-weight="300" fill="rgba(242,244,247,0.72)">to a point, and then stops. Something is</text>
    <text x="0" y="150" font-family="'Outfit', sans-serif" font-size="12" font-weight="300" fill="rgba(242,244,247,0.72)">blocking it. This is the direct, visual proof of</text>
    <text x="0" y="165" font-family="'Outfit', sans-serif" font-size="12" font-weight="300" fill="rgba(242,244,247,0.72)">a pulmonary embolism.</text>

    <!-- Key fact callout -->
    <rect x="0" y="190" width="316" height="70" fill="rgba(200,169,110,0.06)"/>
    <line x1="0" y1="190" x2="0" y2="260" stroke="#c8a96e" stroke-width="2"/>
    <text x="14" y="208" font-family="'DM Mono', monospace" font-size="8" fill="#c8a96e" letter-spacing="1.6">KEY FACT</text>
    <text x="14" y="226" font-family="'Outfit', sans-serif" font-size="11" fill="#f2f4f7">This is the gold-standard diagnosis. The defect</text>
    <text x="14" y="242" font-family="'Outfit', sans-serif" font-size="11" fill="#f2f4f7">is the clot itself, photographed in place.</text>

    <!-- Stage buttons -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="73" height="40" fill="transparent" stroke="rgba(255,255,255,0.08)" rx="2"/>
      <text x="36" y="17" font-family="'DM Mono', monospace" font-size="9" fill="rgba(242,244,247,0.42)" letter-spacing="0.9" text-anchor="middle">01</text>
      <text x="36" y="30" font-family="'DM Mono', monospace" font-size="9" fill="rgba(242,244,247,0.42)" letter-spacing="0.9" text-anchor="middle">BASELINE</text>

      <rect x="81" y="0" width="73" height="40" fill="transparent" stroke="rgba(255,255,255,0.08)" rx="2"/>
      <text x="117" y="17" font-family="'DM Mono', monospace" font-size="9" fill="rgba(242,244,247,0.42)" letter-spacing="0.9" text-anchor="middle">02</text>
      <text x="117" y="30" font-family="'DM Mono', monospace" font-size="9" fill="rgba(242,244,247,0.42)" letter-spacing="0.9" text-anchor="middle">INJECT</text>

      <rect x="162" y="0" width="73" height="40" fill="transparent" stroke="rgba(255,255,255,0.08)" rx="2"/>
      <text x="198" y="17" font-family="'DM Mono', monospace" font-size="9" fill="rgba(242,244,247,0.42)" letter-spacing="0.9" text-anchor="middle">03</text>
      <text x="198" y="30" font-family="'DM Mono', monospace" font-size="9" fill="rgba(242,244,247,0.42)" letter-spacing="0.9" text-anchor="middle">PEAK</text>

      <rect x="243" y="0" width="73" height="40" fill="rgba(224,92,92,0.15)" stroke="#e05c5c" rx="2"/>
      <text x="279" y="17" font-family="'DM Mono', monospace" font-size="9" fill="#e05c5c" letter-spacing="0.9" text-anchor="middle">04</text>
      <text x="279" y="30" font-family="'DM Mono', monospace" font-size="9" fill="#e05c5c" letter-spacing="0.9" text-anchor="middle">DEFECT</text>
    </g>
  </g>

  <!-- Bottom frame -->
  <line x1="0" y1="564" x2="800" y2="564" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="24" y="585" font-family="'Outfit', sans-serif" font-size="9" font-style="italic" fill="rgba(242,244,247,0.42)">For educational purposes only. Not a substitute for professional medical evaluation.</text>
  <text x="776" y="585" font-family="'DM Mono', monospace" font-size="9" fill="#c8a96e" letter-spacing="1.8" text-anchor="end">PETAL · SHANGHAI CHEST HOSPITAL</text>
</svg>
